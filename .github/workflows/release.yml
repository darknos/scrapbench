name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "release $GITHUB_REF_NAME already exists, nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SIGN: "Developer ID Application: Serhiy Nosenko (TSLD4ZR9YC)"
    steps:
      - uses: actions/checkout@v4

      - name: Install librsvg
        run: brew install librsvg

      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Test
        run: make test

      - name: Build and sign
        run: make app SIGN="$SIGN"

      - name: Notarize and staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          Scripts/notarize.sh build/Scrapbench.app "build/Scrapbench-$VERSION.zip"
          rm "$APPLE_API_KEY_PATH"

      - name: Checksum
        run: |
          cd build
          shasum -a 256 "Scrapbench-$VERSION.zip" | tee "Scrapbench-$VERSION.zip.sha256"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/Scrapbench-$VERSION.zip" "build/Scrapbench-$VERSION.zip.sha256" \
            --title "Scrapbench $VERSION" --generate-notes --verify-tag

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "TAP_TOKEN not set, skipping the tap"; exit 0; fi
          sha="$(cut -d' ' -f1 "build/Scrapbench-$VERSION.zip.sha256")"
          git clone --quiet "https://x-access-token:$TAP_TOKEN@github.com/darknos/homebrew-scrapbench.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/scrapbench.rb
          git -c user.name=github-actions -c user.email=actions@github.com commit -am "Scrapbench $VERSION" || exit 0
          git push --quiet

      - name: Remove keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
