name: Bug report
description: Something does not work the way the README says
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Scrapbench version
      description: From About Scrapbench in the menu bar menu, or `brew info scrapbench`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: Steps, in order. A scrap of text that triggers it helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the banner text if there was one.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Font, file location, keyboard layout, whether the file is on iCloud or Dropbox.
