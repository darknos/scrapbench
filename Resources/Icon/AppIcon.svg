  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- two full lines, one short line, caret -->
  <rect x="268" y="356" width="488" height="64" rx="32" fill="#ECEBE6"/>
  <rect x="268" y="480" width="328" height="64" rx="32" fill="#ECEBE6"/>
  <rect x="268" y="604" width="200" height="64" rx="32" fill="#ECEBE6"/>
